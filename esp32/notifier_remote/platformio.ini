; XIAO ESP32S3 (Sense) — AI 작업 알림 원격 중계기
; VS Code의 PlatformIO에서 이 폴더(notifier_remote)를 열고 Upload를 누르세요.
; 처음에는 include/secrets.example.h 를 include/secrets.h 로 복사해 Wi-Fi·토큰을 적어야 합니다.

[env:xiao_esp32s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 기반
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
